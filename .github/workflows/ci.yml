name: ci

on:
  pull_request:
    branches: [main]

# The repository default is read-only; this workflow reads the code and nothing else.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # gofmt exits 0 even when it finds unformatted files, so the list is the verdict.
      - name: gofmt
        run: |
          unformatted="$(gofmt -s -l .)"
          if [ -n "${unformatted}" ]; then
            echo "Not formatted with gofmt -s:"
            echo "${unformatted}"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
